name: Notify Dependents

on:
  workflow_call:
    inputs:
      package_name:
        type: string
        required: false
      repositories:
        type: string
        required: true
    secrets:
      REPO_DISPATCH_TOKEN:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for NPM replication
        run: sleep 15

      - name: Notify dependents
        run: |
          echo "### 🔔 Dependency Notification Status" >> $GITHUB_STEP_SUMMARY
          REPOS="${{ inputs.repositories }}"
          for REPO in $(echo "$REPOS" | tr ',' ' '); do
            echo "Notifying repository: $REPO"
            RESPONSE=$(curl -s -w "%{http_code}" -o resp.json -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.REPO_DISPATCH_TOKEN }}" \
              https://api.github.com/repos/$REPO/dispatches \
              -d '{"event_type":"dependency-updated","client_payload":{"package":"${{ inputs.package_name }}"}}')
            
            if [ "$RESPONSE" = "204" ]; then
              echo "* **[$REPO](https://github.com/$REPO/actions)**: ✅ Dispatched successfully (HTTP 204)" >> $GITHUB_STEP_SUMMARY
            else
              echo "* **[$REPO](https://github.com/$REPO/actions)**: ❌ Failed to dispatch (HTTP $RESPONSE)" >> $GITHUB_STEP_SUMMARY
              cat resp.json >> $GITHUB_STEP_SUMMARY
            fi
          done
